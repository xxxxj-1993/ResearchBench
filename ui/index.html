<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>科研工作台</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="shortcut icon" href="/favicon.ico">
<style>
:root{
  --bg:#f7f8f5; --card:#ffffff; --card2:#fcfdfb;
  --line:#e6ebe3; --line2:#eef2ec;
  --ink:#23302a; --ink2:#5d6c63; --ink3:#8e9c93;
  --green:#4a7c59; --green-d:#3c6849; --green-soft:#eef4ee; --green-line:#d5e4d8;
  --sage:#7d9b76; --sage-soft:#f0f4ee;
  --blue:#6b8cae; --blue-soft:#eef3f8;
  --orange:#c08a4b; --orange-soft:#faf3e8;
  --purple:#8b7bb0; --purple-soft:#f3f0f8;
  --red:#b5564f; --red-soft:#fbefee;
  --gold:#cf9b3f; --gold-soft:#fbf3e2;
  --r:14px; --r-sm:10px;
  --sh:0 1px 2px rgba(40,60,45,.04),0 4px 14px rgba(40,60,45,.04);
  --sh-h:0 2px 6px rgba(40,60,45,.07),0 10px 28px rgba(40,60,45,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.6;overflow:hidden}
button{font-family:inherit;font-size:13px;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
svg{display:block;flex:0 0 auto}
.hide{display:none !important}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#d8e0d6;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#c3cfc1}
::-webkit-scrollbar-track{background:transparent}
.app{display:flex;height:100vh}
.side{width:206px;flex:0 0 206px;background:var(--card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:16px 12px 12px}
.brand{display:flex;align-items:center;gap:9px;padding:0 6px 14px;font-weight:700;font-size:15px}
.brand .lg{width:30px;height:30px;border-radius:9px;background:var(--green);display:flex;
  align-items:center;justify-content:center;flex:0 0 auto}
.brand small{display:block;font-weight:500;font-size:10.5px;color:var(--ink3)}
.nav{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;overflow:auto}
.nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-sm);
  color:var(--ink2);text-decoration:none;font-size:13.5px;font-weight:600;transition:.14s;cursor:pointer}
.nav a:hover{background:var(--line2);color:var(--ink)}
.nav a.on{background:var(--green-soft);color:var(--green-d)}
.nav a .badge{margin-left:auto;font-size:11px;font-weight:700;color:var(--ink3);
  background:var(--line2);border-radius:20px;padding:1px 7px}
.nav a.on .badge{background:#fff;color:var(--green-d)}
.side-foot{padding:10px 8px 2px;border-top:1px solid var(--line2);margin-top:8px}
.side-foot .st{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);padding:2px 0}
.dot{width:6px;height:6px;border-radius:50%;background:var(--sage);flex:0 0 auto}
.dot.off{background:#c9cfc7}
.dot.wait{background:var(--amber,#d9a441);animation:dotpulse 1.1s ease-in-out infinite}
@keyframes dotpulse{0%,100%{opacity:1}50%{opacity:.3}}
.main{flex:1 1 auto;display:flex;flex-direction:column;min-width:0}
.top{padding:12px 26px;background:rgba(255,255,255,.88);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.hello{font-size:15px;font-weight:700;white-space:nowrap}
.hello span{font-weight:500;color:var(--ink3);font-size:12.5px;margin-left:6px}
.spacer{flex:1 1 auto}
.searchbox{display:flex;align-items:center;gap:7px;height:34px;padding:0 11px;border-radius:9px;
  border:1px solid var(--line);background:var(--card2);color:var(--ink3);font-size:12.5px;
  cursor:pointer;min-width:190px;transition:.14s}
.searchbox:hover{border-color:var(--green-line);color:var(--ink2);background:#fff}
.searchbox kbd{margin-left:auto;font-family:inherit;font-size:10.5px;background:var(--line2);
  border-radius:5px;padding:1px 5px;color:var(--ink3)}
.searchbox input{border:0;outline:none;background:transparent;flex:1 1 auto;font-size:13px;min-width:0}
.focus{display:flex;align-items:center;gap:7px;background:var(--green-soft);border:1px solid var(--green-line);
  border-radius:9px;padding:4px 9px}
.focus .tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;color:var(--green-d);min-width:46px;text-align:center}
.focus.run{background:#eaf5ec;border-color:#c8e2ce}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:9px;
  border:1px solid var(--line);background:#fff;color:var(--ink2);font-weight:600;transition:.14s;white-space:nowrap}
.btn:hover{background:var(--line2);color:var(--ink);border-color:var(--green-line)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-d);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--line2)}
.btn.danger{color:var(--red);border-color:#eddcd9}
.btn.danger:hover{background:var(--red-soft)}
.btn.sm{height:28px;padding:0 9px;font-size:12px;border-radius:8px}
.btn.icon{width:34px;padding:0;justify-content:center}
.langbtn{font-size:11.5px;font-weight:700;letter-spacing:.4px}
.body{flex:1 1 auto;overflow:auto;padding:22px 26px 40px}
.page{max-width:1240px;margin:0 auto}
.pg-h{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.pg-h h1{margin:0;font-size:20px;font-weight:700;display:flex;align-items:center;gap:9px}
.pg-h .sub{font-size:12.5px;color:var(--ink3);padding-bottom:3px}
.pg-h .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card.pad{padding:16px 18px}
.card-h{display:flex;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid var(--line2)}
.card-h h3{margin:0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
.card-h .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.mt{margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 9px;border-radius:20px;
  font-size:11.5px;font-weight:700;white-space:nowrap}
.chip.g{background:var(--green-soft);color:var(--green-d)}
.chip.b{background:var(--blue-soft);color:#4d6f92}
.chip.o{background:var(--orange-soft);color:#9c6c33}
.chip.p{background:var(--purple-soft);color:#6b5c92}
.chip.r{background:var(--red-soft);color:var(--red)}
.chip.n{background:var(--line2);color:var(--ink3)}
.tag{display:inline-block;font-size:11px;color:var(--ink3);background:var(--sage-soft);
  border-radius:6px;padding:2px 7px;margin:2px 4px 2px 0}
.dotsep{color:#c8d0c6;margin:0 6px}
.muted{color:var(--ink3)}
.sub{font-size:12px;color:var(--ink3)}
.empty{padding:30px 16px;text-align:center;color:var(--ink3);font-size:13px;line-height:1.9}
.empty svg{margin:0 auto 10px;opacity:.6}
.kv{font-size:12.5px;color:var(--ink2);margin-top:5px;word-break:break-word}
.kv b{color:var(--ink3);font-weight:600}
.bar{height:5px;border-radius:4px;background:var(--line2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--sage);border-radius:4px;transition:width .3s}
.bar i.over{background:var(--red)} .bar i.warn{background:var(--orange)} .bar i.done{background:var(--green)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--sh)}
.stat .lb{font-size:11.5px;color:var(--ink3);font-weight:600;display:flex;align-items:center;gap:5px}
.stat .vl{font-size:23px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .vl small{font-size:12px;font-weight:500;color:var(--ink3);margin-left:3px}
.tl{padding:6px 0 2px}
.tl-row{display:flex;gap:12px;padding:9px 16px;position:relative}
.tl-row:before{content:"";position:absolute;left:44px;top:0;bottom:0;width:1px;background:var(--line2)}
.tl-row:last-child:before{background:linear-gradient(180deg,var(--line2),transparent)}
.tl-time{width:40px;flex:0 0 40px;font-size:11.5px;color:var(--ink3);font-weight:700;
  text-align:right;padding-top:2px;font-variant-numeric:tabular-nums}
.tl-dot{position:absolute;left:40px;top:14px;width:9px;height:9px;border-radius:50%;
  background:var(--sage);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.tl-body{flex:1 1 auto;min-width:0;padding-left:12px}
.tl-body .t{font-weight:650;font-size:13.5px}
.tl-body .m{font-size:11.5px;color:var(--ink3);margin-top:1px}
.today-hero{background:linear-gradient(180deg,#fff,#fbfcfa);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px}
.today-hero .k{font-size:11.5px;font-weight:700;color:var(--green);letter-spacing:.5px}
.today-hero .big{font-size:17px;font-weight:700;margin:6px 0 4px;line-height:1.45}
.today-hero .nx{background:var(--green-soft);border-radius:var(--r-sm);padding:9px 12px;margin-top:10px;
  font-size:13px;color:var(--green-d);font-weight:600;display:flex;gap:8px;align-items:flex-start}
.act{background:var(--card2);border:1px solid var(--line2);border-radius:var(--r-sm);padding:10px 12px;
  display:flex;gap:10px;align-items:flex-start}
.act+.act{margin-top:8px}
.act .n{width:20px;height:20px;flex:0 0 20px;border-radius:6px;background:var(--green-soft);color:var(--green-d);
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.act .b{flex:1 1 auto;min-width:0}
.act .t{font-size:12.8px;font-weight:650;line-height:1.45}
.act .m{font-size:11.5px;color:var(--ink3);margin-top:2px}
.ck{width:19px;height:19px;flex:0 0 19px;border-radius:6px;border:1.6px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;color:transparent;padding:0;margin-top:2px;cursor:pointer}
.ck:hover{border-color:var(--green)}
.ck.on{background:var(--green);border-color:var(--green);color:#fff}
.rem{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--line2);align-items:flex-start}
.rem:last-child{border-bottom:0}
.rem .ic{width:24px;height:24px;flex:0 0 24px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.cal-bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line2)}
.cal-title{font-size:14.5px;font-weight:700;min-width:126px;text-align:center}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line2)}
.cal-dow div{text-align:center;font-size:11.5px;font-weight:700;color:var(--ink3);padding:8px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:104px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);
  padding:6px 6px 8px;position:relative;transition:.14s}
.cal-cell:nth-child(7n){border-right:0}
.cal-cell.out{background:#fbfcfa}
.cal-cell.out .dn{color:#c3cbc2}
.cal-cell.today{background:#f4f9f4}
.cal-cell.over{background:#fdf8f7}
.cal-cell.drop,.cal-week .wc.drop{background:var(--green-soft);box-shadow:inset 0 0 0 2px var(--green-line)}
.dn{font-size:11.5px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:5px}
.dn .n{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cal-cell.today .dn .n{background:var(--green);color:#fff}
.dn .hol{margin-left:auto;font-size:10px;color:var(--ink3);font-weight:500}
.ev{margin-top:3px;font-size:11px;border-radius:6px;padding:2px 6px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;cursor:grab;border:1px solid transparent;font-weight:600}
.ev.t-h1{background:var(--blue-soft);color:#4d6f92;border-color:#dde8f1}
.ev.t-h2{background:var(--purple-soft);color:#6b5c92;border-color:#e7e1f2}
.ev.t-h3{background:var(--orange-soft);color:#9c6c33;border-color:#f2e5ce}
.ev.t-h4{background:var(--sage-soft);color:#5d7a57;border-color:#dde8d8}
.ev.t-h5{background:var(--line2);color:var(--ink2);border-color:var(--line)}
.dl{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 5px;margin-top:3px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl.paper{background:var(--green-soft);color:var(--green-d);border-left:2px solid var(--sage)}
.dl.proj{background:var(--blue-soft);color:#4d6f92;border-left:2px solid var(--blue)}
.dl.over{background:var(--red-soft);color:var(--red);border-left:2px solid var(--red)}
.cal-week{display:grid;grid-template-columns:58px repeat(7,1fr);border-top:1px solid var(--line2)}
.cal-week .hh{font-size:10.5px;color:var(--ink3);text-align:right;padding-right:6px;
  border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);height:46px;
  display:flex;align-items:flex-start;justify-content:flex-end;font-variant-numeric:tabular-nums}
.cal-week .wc{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);height:46px;position:relative;padding:2px}
.whead{display:grid;grid-template-columns:58px repeat(7,1fr);border-bottom:1px solid var(--line2)}
.whead div{text-align:center;font-size:11.5px;font-weight:700;color:var(--ink3);padding:8px 0}
.md{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
.mlist{display:flex;flex-direction:column;gap:8px;padding:10px;max-height:calc(100vh - 250px);overflow:auto}
.mi{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:#fff;cursor:pointer;transition:.14s}
.mi:hover{border-color:var(--green-line);box-shadow:var(--sh)}
.mi.on{border-color:var(--green);background:var(--green-soft)}
.mi .t{font-size:13px;font-weight:650;line-height:1.45;display:block;word-break:break-word}
.mi .m{font-size:11.5px;color:var(--ink3);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.detail{padding:18px 20px}
.detail .dh{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.detail .dh h2{margin:0;font-size:17px;font-weight:700;line-height:1.45;flex:1 1 300px;min-width:0}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin-top:14px}
.dcell{background:var(--card2);border:1px solid var(--line2);border-radius:var(--r-sm);padding:9px 11px}
.dcell .k{font-size:11px;color:var(--ink3);font-weight:600}
.dcell .v{font-size:13px;font-weight:650;margin-top:2px;word-break:break-word}
.sect-h{font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.5px;margin:16px 0 7px;
  padding-bottom:5px;border-bottom:1px solid var(--line2)}
.fileline{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer}
.fileline:hover{background:var(--line2)}
.fileline .fn{flex:1 1 auto;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;
  box-shadow:var(--sh);position:relative;overflow:hidden;transition:.16s}
.wcard:hover{box-shadow:var(--sh-h);transform:translateY(-1px)}
.wcard .yr{position:absolute;right:12px;top:9px;font-size:12px;font-weight:700;color:var(--ink3)}
.wcard .jr{font-size:11.5px;font-weight:700;color:var(--green-d);background:var(--green-soft);
  display:inline-block;border-radius:6px;padding:2px 8px;margin-bottom:8px}
.wcard .ti{font-size:13.5px;font-weight:650;line-height:1.5;padding-right:34px;word-break:break-word}
.wcard .au{font-size:11.5px;color:var(--ink3);margin-top:6px}
.wcard .ft{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.icard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
  box-shadow:var(--sh);transition:.16s;display:flex;flex-direction:column}
.icard:hover{box-shadow:var(--sh-h)}
.icard .t{font-size:13.5px;font-weight:700;line-height:1.45}
.icard .c{font-size:12.5px;color:var(--ink2);margin-top:7px;line-height:1.7;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;flex:1 1 auto}
.icard .ft{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
.dpaper{background:linear-gradient(180deg,#fffdf8,#fdfbf5);border:1px solid #ece5d6;
  border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh)}
.dpaper .dt{font-family:Georgia,"Songti SC","SimSun",serif;font-size:13.5px;line-height:1.95;
  color:#3a3c33;white-space:pre-wrap;word-break:break-word}
.dpaper .dh{display:flex;align-items:center;gap:9px;margin-bottom:10px;padding-bottom:9px;
  border-bottom:1px dashed #e6ddca;flex-wrap:wrap}
.dpaper .dd{font-family:Georgia,"Songti SC",serif;font-size:13px;font-weight:700;color:#5d5a4a}
.mood{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 9px}
.mood.m1{background:#eaf5ec;color:#3c6849} .mood.m2{background:#eef3f8;color:#4d6f92}
.mood.m3{background:#f2f3f1;color:#6d7a72} .mood.m4{background:#faf3e8;color:#9c6c33}
.mood.m5{background:#f3f0f8;color:#6b5c92}
.cat{margin-bottom:18px}
.cat-h{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.cat-h h3{margin:0;font-size:13.5px;font-weight:700}
.cat-h .n{font-size:11.5px;color:var(--ink3);font-weight:600}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(208px,1fr));gap:10px}
.li{position:relative;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:#fff;
  cursor:pointer;transition:.14s;display:flex;gap:10px;align-items:flex-start;min-height:66px}
.li:hover{border-color:var(--green-line);background:var(--card2);transform:translateY(-1px);box-shadow:var(--sh)}
.li .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.li .n{font-size:13px;font-weight:650;word-break:break-all;line-height:1.35}
.li .p{font-size:10.5px;color:var(--ink3);margin-top:3px;word-break:break-all;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.li .x{position:absolute;top:5px;right:5px;display:flex;gap:3px;opacity:0;transition:.14s}
.li:hover .x{opacity:1}
.li .x button{width:21px;height:21px;border-radius:6px;background:var(--line2);color:var(--ink2);
  display:flex;align-items:center;justify-content:center}
.li .x button:hover{background:var(--green);color:#fff}
.li .x button.del:hover{background:var(--red)}
.li.add{border-style:dashed;display:flex;align-items:center;justify-content:center;gap:6px;
  color:var(--ink3);font-weight:600}
.li.add:hover{color:var(--green-d);border-color:var(--green);background:var(--green-soft)}
/* 拖拽排序 */
.li.sc{cursor:grab}
.li.sc:active{cursor:grabbing}
.li.sc .grip{display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  width:18px;color:var(--ink3);opacity:.55;margin-left:-4px;cursor:grab}
.li.sc:hover .grip{opacity:.9}
.li.sc.sc-drop{border-color:var(--green);box-shadow:inset 0 0 0 2px var(--green-line);
  background:var(--green-soft)}
.li.sc.dragging{opacity:.45}
.cat-h .hint{font-size:11px;color:var(--ink3);font-weight:500;background:var(--line2);
  padding:1px 7px;border-radius:6px}
/* 代表作 */
.wcard.rep{border-color:var(--gold);background:linear-gradient(180deg,#fffdf7,var(--card))}
.wcard .rep-tag{position:absolute;left:10px;top:8px;display:inline-flex;align-items:center;gap:3px;
  font-size:10.5px;font-weight:700;color:var(--gold);background:var(--gold-soft);
  padding:1px 7px;border-radius:20px}
.btn.star.on{color:var(--gold);background:var(--gold-soft)}
.drawer{border-top:1px solid var(--line2);background:var(--card2);padding:10px 14px;max-height:290px;overflow:auto}
.frow{display:flex;align-items:center;gap:9px;padding:6px 4px;border-bottom:1px solid var(--line2);cursor:pointer}
.frow:last-child{border-bottom:0}
.frow:hover{background:var(--green-soft)}
.frow .fn{flex:1 1 auto;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .fm{font-size:10.5px;color:var(--ink3);flex:0 0 auto}
.mask{position:fixed;inset:0;background:rgba(35,48,42,.34);display:flex;align-items:flex-start;
  justify-content:center;z-index:200;padding:36px 16px;overflow:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:620px;box-shadow:0 20px 60px rgba(35,48,42,.24)}
.modal.wide{max-width:840px}
.modal .mh{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line2)}
.modal .mh h3{margin:0;font-size:15px;font-weight:700;flex:1 1 auto}
.modal .mb{padding:16px 18px;max-height:min(64vh,680px);overflow:auto}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:13px 18px;border-top:1px solid var(--line2);
  background:var(--card2);border-radius:0 0 16px 16px}
.fld{margin-bottom:12px}
.fld>label{display:block;font-size:11.5px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;background:#fff;outline:none;transition:.14s;font-size:13.5px}
.fld textarea{resize:vertical;min-height:76px;line-height:1.7}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgba(125,155,118,.16)}
.fld .row{display:flex;gap:8px}
.fld .row>*{flex:1 1 0;min-width:0}
.fld .row .btn{flex:0 0 auto;height:auto;padding:9px 12px}
.seg{display:flex;gap:4px;background:var(--line2);border-radius:9px;padding:3px;flex-wrap:wrap}
.seg button{padding:6px 11px;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--green-d);box-shadow:0 1px 3px rgba(40,60,45,.1)}
.palette .pin{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line2)}
.palette .pin input{flex:1 1 auto;border:0;outline:none;font-size:15px;background:transparent}
.palette .res{max-height:min(58vh,500px);overflow:auto;padding:6px}
.pgrp{font-size:11px;font-weight:700;color:var(--ink3);padding:9px 12px 4px;letter-spacing:.4px}
.pit{display:flex;gap:10px;align-items:flex-start;padding:8px 11px;border-radius:9px;cursor:pointer}
.pit:hover,.pit.on{background:var(--green-soft)}
.pit .b{flex:1 1 auto;min-width:0}
.pit .t{font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pit .m{font-size:11px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zrow{display:flex;gap:10px;padding:9px 11px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.zrow:hover{background:var(--sage-soft);border-color:var(--green-line)}
.zrow .b{flex:1 1 auto;min-width:0}
.zrow .t{font-size:12.8px;font-weight:650;line-height:1.45}
.zrow .m{font-size:11px;color:var(--ink3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:400;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tst{background:#2b3a32;color:#fff;padding:9px 14px;border-radius:10px;font-size:12.5px;font-weight:600;
  box-shadow:0 8px 26px rgba(35,48,42,.24);display:flex;align-items:center;gap:12px;
  pointer-events:auto;animation:tin .18s ease;max-width:min(92vw,560px)}
.tst.err{background:var(--red)} .tst.ok{background:var(--green)}
.tst button{color:#fff;text-decoration:underline;font-weight:700;font-size:12.5px;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mobile-nav{display:none}
@media(max-width:1080px){
  .grid2{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr 1fr}
  .md{grid-template-columns:1fr}
  .mlist{max-height:none}
}
@media(max-width:820px){
  .side{display:none}
  .grid3,.grid4{grid-template-columns:1fr 1fr}
  .body{padding:14px 14px 96px}
  .top{padding:10px 14px;gap:8px}
  .hello{font-size:14px}
  .searchbox{min-width:0;flex:1 1 120px}
  .mobile-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:120;background:rgba(255,255,255,.97);
    border-top:1px solid var(--line);padding:5px 4px calc(5px + env(safe-area-inset-bottom));
    justify-content:space-around;overflow-x:auto}
  .mobile-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;
    color:var(--ink3);font-weight:600;padding:4px 6px;border-radius:9px;text-decoration:none;min-width:50px;cursor:pointer}
  .mobile-nav a.on{color:var(--green-d);background:var(--green-soft)}
  .cal-cell{min-height:72px}
  .wall,.lg{grid-template-columns:1fr}
  .btn{height:36px}
  .fld input,.fld select,.fld textarea{font-size:16px}
}
 /* ---- 课表 ---- */
 .sched{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
 .sched th{font-size:12px;font-weight:500;color:var(--ink3);padding:6px 4px;text-align:center}
 .sched th.today{color:var(--green-d);font-weight:600}
 .sched td{vertical-align:top;background:var(--card2);border:1px solid var(--line2);
   border-radius:var(--r-sm);height:52px;padding:0}
 .sched td.pd{width:52px;background:transparent;border:none;text-align:center;
   font-size:11px;color:var(--ink3);padding-top:6px}
 .sched td.pd b{display:block;font-size:12.5px;color:var(--ink2);font-weight:500}
 .sched td.pd span{font-size:10px;color:var(--ink3)}
 .sched td.emptycell{cursor:pointer}
 .sched td.emptycell:hover{background:var(--green-soft);border-color:var(--green-line)}
 .sched td.has-cls{padding:0}
 .clscard{height:100%;border-radius:var(--r-sm);padding:7px 8px;cursor:pointer;
   display:flex;flex-direction:column;gap:2px;overflow:hidden}
 .clscard:hover{filter:brightness(.97)}
 .clscard .nm{font-size:12.5px;font-weight:500;line-height:1.35;color:var(--ink)}
 .clscard .lo{font-size:11px;color:var(--ink3);line-height:1.3}
 .clscard .wk{font-size:10.5px;color:var(--ink3)}
 .today-tag{display:inline-block;width:5px;height:5px;border-radius:50%;
   background:var(--green);margin-left:4px;vertical-align:middle}
 /* ---- 导入预览 ---- */
 #imPreview .hint{margin:6px 0}
/* ---- 总课表列表 / 粘贴导入 ---- */
table.lst{width:100%;border-collapse:collapse;font-size:13px}
table.lst th{text-align:left;font-weight:500;color:var(--ink2);padding:7px 8px;
  border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
table.lst td{padding:5px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.lst tr:last-child td{border-bottom:none}
table.lst td.nm{font-weight:500}
table.lst td.nm a{color:var(--ink);text-decoration:none}
table.lst td.nm a:hover{color:var(--green)}
table.lst td input,table.lst td select{width:100%;min-width:52px;box-sizing:border-box;
  font-size:12px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;
  background:var(--card);color:var(--ink);font-family:inherit}
table.lst td input:focus,table.lst td select:focus{outline:none;border-color:var(--green)}
table.lst td.ck{width:28px}
table.lst td.op{white-space:nowrap;text-align:right;width:1%}
table.lst input.pdn{width:46px;min-width:46px;text-align:center}
table.lst td.nowrap{white-space:nowrap}
table.lst span.dash{margin:0 2px;color:var(--ink3)}
.lst-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px}
.lst-bar .lb{font-size:13px;color:var(--ink2)}
.pastebox{min-height:100px;max-height:180px;overflow:auto;border:1px dashed var(--line);
  border-radius:var(--r-sm);padding:10px 12px;font-size:12px;line-height:1.6;
  color:var(--ink2);background:var(--card2);white-space:pre-wrap;
  word-break:break-all;outline:none}
.pastebox:focus{border-color:var(--green);border-style:solid}
.imp-wrap{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
/* ---- 导航项右键菜单 + 就地重命名 ---- */
.ctx{position:fixed;z-index:500;min-width:158px;background:#fff;border:1px solid var(--line);
  border-radius:11px;box-shadow:0 12px 34px rgba(35,48,42,.18);padding:5px;animation:ctxin .12s ease}
@keyframes ctxin{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.ctx .hd{font-size:11px;font-weight:700;color:var(--ink3);padding:6px 10px 4px;letter-spacing:.3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 10px;
  border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.ctx button:hover{background:var(--green-soft);color:var(--green-d)}
.nav a .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav a .lbin{flex:1 1 auto;min-width:0;height:23px;border:1px solid var(--green-line);border-radius:6px;
  padding:0 6px;font-size:12.5px;font-weight:700;background:#fff;outline:none;
  box-shadow:0 0 0 3px rgba(125,155,118,.16)}
.nav a.editing{background:var(--green-soft)}
.nav a.editing .badge{display:none}
</style>

/* ================= 小工具 ================= */
function todayStr(){ var d=new Date();
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function dayStr(v){ if(!v) return ''; var s=String(v); if(s.length>=10) s=s.slice(0,10);
  return /^\d{4}-\d{2}-\d{2}$/.test(s)? s : ''; }
function daysLeft(ds){ if(!ds) return null;
  var a=new Date(ds+'T00:00:00'), b=new Date(todayStr()+'T00:00:00');
  return Math.round((a-b)/86400000); }
function fmtSize(n){ if(n<1024) return n+' B';
  if(n<1048576) return (n/1024).toFixed(1)+' KB';
  if(n<1073741824) return (n/1048576).toFixed(1)+' MB';
  return (n/1073741824).toFixed(2)+' GB'; }
function fmtTime(t){ var d=new Date(t*1000);
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function uid(p){ return (p||'x')+Date.now().toString(36)+Math.floor(Math.random()*10000).toString(36); }
function api(url,data){
  if(data!==undefined){
    return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(data)}).then(function(r){ return r.json(); });
  }
  return fetch(url).then(function(r){ return r.json(); });
}
function toast(msg,kind,undoFn){

  if(undoFn){

    b.onclick=function(){ undoFn(); if(d.parentNode) d.parentNode.removeChild(d); };

function dueList(days){

function loadObsMatch(pid){
  var box=$('obsBox'); if(!box) return;
  var p=findPaper(pid); if(!p) return;
  if(!S.obs.vaults.length){ box.innerHTML='<div class="sub">'+(LANG==='zh'?'未检测到 Obsidian 仓库':'No Obsidian vault')+'</div>'; return; }
  if(S._obsM&&S._obsM.pid===pid&&Date.now()-S._obsM.ts<60000){ renderObsMatch(pid); return; }
  box.innerHTML='<div class="sub" style="padding:2px 0">'+(LANG==='zh'?'匹配中…':'Matching…')+'</div>';
  api('/api/obsidian/match?vault='+encodeURIComponent(vaultArg())+'&title='+encodeURIComponent(p.title||''))
    .then(function(r){
      S._obsM={pid:pid,ts:Date.now(),items:(r&&r.items)||[]};

        +(e3.end?'-'+esc(e3.end):'')+' · '+esc(e3.type||'其他')+(rel?' · '+esc(rel):'')+'</div></div>'

}

/* ================= 课表 ================= */
var DOW=['','周一','周二','周三','周四','周五','周六','周日'];
var DOWEN=['','Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var CLSCOLORS=[['var(--green-soft)','var(--green-line)'],
               ['var(--blue-soft)','var(--blue-line)'],
               ['var(--purple-soft)','var(--purple-line)'],
               ['var(--orange-soft)','var(--orange-line)'],
               ['var(--gold-soft)','var(--gold-line)'],
               ['var(--red-soft)','var(--red-line)']];
function dowName(n){ return LANG==='zh'? DOW[n] : DOWEN[n]; }
function dayOpts(cur){
  var h='';
  for(var i=1;i<=7;i++)
    h+='<option value="'+i+'"'+(parseInt(cur,10)===i?' selected':'')+'>'+esc(dowName(i))+'</option>';
  return h;
}
function todayDow(){ var d=new Date().getDay(); return d===0?7:d; }
// 开学第一周周一 → 现在第几周（1 起）；没设开学日返回 0
function semesterWeek(){
  var st=(S.db.settings&&S.db.settings.semStart)||'';
  if(!st) return 0;
  var d0=new Date(st+'T00:00:00');
  if(isNaN(d0.getTime())) return 0;
  var wk=weekStartOf(new Date());
  return Math.round((wk-d0)/604800000)+1;
}
function periodTime(n){
  var t=(S.db.settings&&S.db.settings.periodTimes)||'';
  if(!t) return '';
  var arr=String(t).split(',');
  return arr[n-1]? String(arr[n-1]).trim() : '';
}
// 某节课在「第 wkN 周」是否要显示（行课周次 + 单双周）
function classVisible(c,wkN){
  var w=String(c.weeks||'').trim();
  if(w && wkN>0){                       // 行课周期，如 1-16 / 5-10
    var m=w.match(/(\d{1,2})\s*[-–~]\s*(\d{1,2})/);
    if(m){
      var a=parseInt(m[1],10), b=parseInt(m[2],10);
      if(wkN<a || wkN>b) return false;
    }
  }
  var odd=c.odd||'all';
  if(odd!=='odd'&&odd!=='even') return true;
  if(!wkN||wkN<1) return true;
  return ((wkN%2)===1) === (odd==='odd');
}
function classesOn(dow,wkN){
  var out=[], arr=S.db.classes||[], i;
  for(i=0;i<arr.length;i++){
    var c=arr[i];
    if((parseInt(c.day,10)||0)!==dow) continue;
    if(wkN!=null&&!classVisible(c,wkN)) continue;
    out.push(c);
  }
  out.sort(function(a,b){ return (parseInt(a.start,10)||0)-(parseInt(b.start,10)||0); });
  return out;
}
function clsColor(c,n){
  var i=Math.abs(parseInt(c.color,10)||String(c.name||'').length+n);
  return CLSCOLORS[i%CLSCOLORS.length];
}
function classCardHtml(c,n){
  var col=clsColor(c,n||0);
  var sec=Math.max(1,parseInt(c.sections,10)||1);
  var meta=[];
  if(c.location) meta.push(c.location);
  if(sec>1) meta.push((LANG==='zh'?('连上'+sec+'节'):(sec+' periods')));
  if(c.odd==='odd') meta.push(LANG==='zh'?'单周':'odd wk');
  if(c.odd==='even') meta.push(LANG==='zh'?'双周':'even wk');
  var zn=(LANG==='zh'?'第':'')+(parseInt(c.start,10)||1)+(LANG==='zh'?'节':'');
  return '<div class="clscard" style="background:'+col[0]+';border:1px solid '+col[1]+'" '
    +'data-act="editClass" data-id="'+esc(c.id)+'" title="'+esc((c.name||'')+(c.teacher?(' · '+c.teacher):''))+'">'
    +'<div class="nm">'+esc(c.name||'')+'</div>'
    +(meta.length?'<div class="lo">'+esc(meta.join(' · '))+'</div>':'')
    +'<div class="wk">'+esc(zn)+'</div></div>';
}

    +'</div></div>';
  h+='<div class="card"><div style="padding:14px;overflow-x:auto">';
  h+='<table class="sched"><thead><tr><th class="pd"></th>';
  var td=todayDow();
  for(j=1;j<=7;j++)
    h+='<th'+(j===td?' class="today"':'')+'>'+esc(dowName(j))+((j===td&&!off)?'<span class="today-tag"></span>':'')+'</th>';

        :'Structured entries can be filtered by week and show up on the Today page automatically.')+'</div>';
  h+='</div>';

/* ---------- 引用格式 / BibTeX / 剪贴板 ---------- */
// 作者列表：两个及以上时，最后一个前补 and（Optica / ACS 风格）
function citeAuthors(s){
  s=String(s||'').replace(/\s+/g,' ').trim();
  if(!s) return '';
  var parts=s.split(','), arr=[], i;
  for(i=0;i<parts.length;i++){ var x=parts[i].trim(); if(x) arr.push(x); }
  if(arr.length>=2) return arr.slice(0,-1).join(', ')+', and '+arr[arr.length-1];
  return s;
}
// A. Author*, ..., and B. Researcher*, "Title," Example Journal 13, 100–110 (2025).
function citeText(w){
  var seg=[];
  var au=citeAuthors(w.authors);
  if(au) seg.push(au+', ');
  seg.push('"'+String(w.title||'')+'", ');
  if(w.journal) seg.push(w.journal+' ');
  if(w.volume) seg.push(w.volume+', ');
  if(w.pages) seg.push(w.pages+' ');
  seg.push('('+(w.year||'')+').');
  return seg.join('').replace(/[ \t]+/g,' ').replace(/\s+,/g,',').trim();
}
function bibAuthors(s){
  return String(s||'').split(',')
    .map(function(x){ return x.replace(/\*/g,'').trim(); })
    .filter(function(x){ return x; }).join(' and ');
}
function bibKeyOf(w){
  var au=String(w.authors||'').split(',')[0].replace(/\*/g,'').trim();
  var last='';
  if(au){ var sp=au.split(/\s+/); last=sp[sp.length-1]; }
  last=last.toLowerCase().replace(/[^a-z]/g,'');
  var tw=(String(w.title||'').toLowerCase().replace(/[^a-z ]/g,' ')
          .split(/\s+/).filter(function(x){ return x.length>3; })[0])||'';
  return (last||'ref')+(w.year||'')+(tw||'');
}
function bibText(w){
  var type=String(w.bibtype||'article').replace(/[^a-z]/g,'')||'article';
  var field=w.journal?'journal':'publisher';
  var L=[];
  L.push('@'+type+'{'+bibKeyOf(w)+',');
  if(w.authors)  L.push('  author  = {'+bibAuthors(w.authors)+'},');
  L.push('  title   = {'+String(w.title||'')+'},');
  if(w.journal)  L.push('  '+field+'= {'+w.journal+'},');
  if(w.year)     L.push('  year    = {'+w.year+'},');
  if(w.volume)   L.push('  volume  = {'+w.volume+'},');
  if(w.pages)    L.push('  pages   = {'+w.pages+'},');
  if(w.doi)      L.push('  doi     = {'+w.doi+'}');
  L.push('}');
  // 最后一行没有 doi 时，倒数第二个结尾的逗号要去掉
  var out=L.join('\n');
  if(!w.doi) out=out.replace(/,(\s*\}\s*)$/,'$1');
  return out;
}
function legacyCopy(t){
  try{
    var ta=document.createElement('textarea');
    ta.value=t; ta.style.position='fixed'; ta.style.left='-9999px'; ta.style.top='0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, ta.value.length);
    var ok=document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(t).then(function(){ return true; })
      .catch(function(){ return legacyCopy(t); });
  }
  return Promise.resolve(legacyCopy(t));
}
function doCopy(t,tip){
  copyText(t).then(function(ok){
    toast(ok?((tip||'已复制')):('复制失败，请手动选中下面的文本'), ok?'ok':'err');
  });
}

function refreshCitationCounts(){
  if(S.citationUpdating) return;
  var pubs=S.db.pubs||[];
  if(!pubs.length){ toast(LANG==='zh'?'还没有已发表论文':'No publications yet','err'); return; }
  var query=pubs.map(function(w){ return {id:w.id,doi:w.doi||''}; });
  var hasDoi=query.some(function(w){ return !!String(w.doi||'').trim(); });
  if(!hasDoi){ toast(LANG==='zh'?'没有可查询的 DOI，请先补充 DOI':'Add DOI before updating','err'); return; }
  S.citationUpdating=true; refreshAll();
  toast(LANG==='zh'?'正在从 OpenAlex 查询引用次数…':'Updating citations from OpenAlex…');
  var backups=[];
  api('/api/citations/refresh',{items:query}).then(function(r){
    if(!r||!r.ok) throw new Error((r&&r.msg)||(LANG==='zh'?'查询失败':'Lookup failed'));
    var rows=r.results||[], changed=0;
    for(var i=0;i<rows.length;i++){
      var w=byId(S.db.pubs,rows[i].id); if(!w) continue;
      backups.push({w:w,cites:w.cites,citesSource:w.citesSource,
                    citesUpdatedAt:w.citesUpdatedAt,openalexId:w.openalexId});
      w.cites=parseInt(rows[i].cites,10)||0;
      w.citesSource=rows[i].source||'OpenAlex';
      w.citesUpdatedAt=rows[i].updatedAt||'';
      w.openalexId=rows[i].openalexId||'';
      changed++;
    }
    var done=function(){
      S.citationUpdating=false; refreshAll();
      var msg=LANG==='zh'
        ?('引用更新完成：成功 '+changed+' 篇，跳过 '+(r.skippedCount||0)+' 篇，失败 '+(r.failedCount||0)+' 篇')
        :('Citation update: '+changed+' updated, '+(r.skippedCount||0)+' skipped, '+(r.failedCount||0)+' failed');
      toast(msg,changed?'ok':((r.failedCount||0)?'err':null));
    };
    if(changed) return saveKey('pubs').then(function(saved){
      if(!saved||!saved.ok) throw new Error(LANG==='zh'?'本地保存失败':'Local save failed');
      done();
    });
    done();
  }).catch(function(e){
    for(var i=0;i<backups.length;i++){
      var b=backups[i], w=b.w;
      w.cites=b.cites;
      if(b.citesSource===undefined) delete w.citesSource; else w.citesSource=b.citesSource;
      if(b.citesUpdatedAt===undefined) delete w.citesUpdatedAt; else w.citesUpdatedAt=b.citesUpdatedAt;
      if(b.openalexId===undefined) delete w.openalexId; else w.openalexId=b.openalexId;
    }
    S.citationUpdating=false; refreshAll();
    toast((LANG==='zh'?'引用更新失败：':'Citation update failed: ')+(e&&e.message?e.message:e),'err');
  });
}

function formZoteroPicker(paperId){
  if(!zoteroOK()) return;
  var body='<div class="fld"><div class="row">'
    +'<div style="flex:2 1 0"><label>'+(LANG==='zh'?'搜索文献':'Search')+'</label>'
    +'<input id="zq" placeholder="'+(LANG==='zh'?'标题 / 摘要 / 期刊 / DOI':'title / abstract / journal / DOI')+'"></div>'
    +'<div style="flex:1 1 0"><label>'+(LANG==='zh'?'分类':'Collection')+'</label>'
    +'<select id="zc"><option value="">'+(LANG==='zh'?'全部（最近添加）':'All (recent)')+'</option></select></div>'
    +'</div></div><div id="zRes" style="max-height:min(52vh,460px);overflow:auto">'
    +'<div class="sub" style="padding:14px">'+ic('refresh',13)+' '+(LANG==='zh'?'读取中…':'Loading…')+'</div></div>';
  modal(LANG==='zh'?'关联 Zotero 文献':'Link Zotero item', body, '<button class="btn" data-act="closeModal">'+esc(tt('close'))+'</button>', true);

  api('/api/zotero/collections').then(function(r){
    var sel=$('zc'); if(!sel||!r||!r.collections) return;
    var flat=[];
    (function walk(list,depth){
      for(var i=0;i<list.length;i++){
        flat.push({id:list[i].id,name:list[i].name,count:list[i].count,depth:depth});
        if(list[i].children&&list[i].children.length) walk(list[i].children,depth+1);
      }
    })(r.collections,0);
    for(var i=0;i<flat.length;i++){
      var o=document.createElement('option');
      o.value=flat[i].id;
      o.textContent=new Array(flat[i].depth+1).join('　')+flat[i].name+' ('+flat[i].count+')';
      sel.appendChild(o);
    }
  });
  function load(){
    var box=$('zRes'); if(!box) return;
    box.innerHTML='<div class="sub" style="padding:14px">'+(LANG==='zh'?'读取中…':'Loading…')+'</div>';
    var q=v('zq'), c=v('zc');
    api('/api/zotero/items?limit=120&q='+encodeURIComponent(q)+'&collection='+encodeURIComponent(c)).then(function(r){
      var items=(r&&r.items)||[];
      if(!items.length){ box.innerHTML='<div class="empty">'+(LANG==='zh'?'没有匹配的文献':'No matches')+'</div>'; return; }
      var h='';
      for(var i=0;i<items.length;i++){
        var it=items[i], au=(it.creators||[]).slice(0,2).join(', ');
        h+='<div class="zrow" data-act="zlink" data-pid="'+esc(paperId)+'" data-i="'+i+'">'
          + ic('db',14,'var(--blue)')+'<div class="b"><div class="t">'+esc(it.title)+'</div>'
          +'<div class="m">'+esc(au)+(it.date?' · '+esc(String(it.date).slice(0,4)):'')
          +(it.publication?' · '+esc(it.publication):'')+'</div></div>'
          + (it.attachments&&it.attachments.length? '<span class="chip g">PDF</span>':'')
          +'</div>';
      }
      box.innerHTML=h;
      S._zCache=items;
    });
  }
  $('zq').oninput=(function(){ var t=null; return function(){ clearTimeout(t); t=setTimeout(load,320); }; })();
  $('zc').onchange=load;
  load();
}
function linkZotero(paperId, idx){
  var p=findPaper(paperId); if(!p||!S._zCache) return;
  var it=S._zCache[idx]; if(!it) return;
  p.zoteroKeys=p.zoteroKeys||[];
  for(var i=0;i<p.zoteroKeys.length;i++) if(p.zoteroKeys[i].key===it.key) { closeModal(); toast(LANG==='zh'?'已经关联过了':'Already linked'); return; }
  var att=null;
  for(i=0;i<(it.attachments||[]).length;i++) if(it.attachments[i].exists){ att=it.attachments[i]; break; }
  p.zoteroKeys.push({key:it.key,title:it.title,journal:it.publication||'',doi:it.doi||'',
    year:String(it.date||'').slice(0,4),path:att?att.path:'',authors:(it.creators||[]).join(', ')});
  p.updatedAt=Date.now();
  logHistory(p,'关联文献：'+it.title);
  saveKey('papers'); closeModal(); refreshAll(); toast(LANG==='zh'?'已关联文献':'Linked','ok');
}
function openZoteroItem(paperId, idx){
  var p=findPaper(paperId); if(!p) return;
  var z=(p.zoteroKeys||[])[idx]; if(!z) return;
  if(z.path) doOpen('file', z.path);

    h2+='<div class="pgrp">Obsidian</div><div id="pObs" class="sub" style="padding:6px 12px">'

          + ic('db',13,'var(--blue)')+'<div class="b"><div class="t">'+esc(is[i].title)+'</div>'
          +'<div class="m">'+esc(is[i].publication||'')+(is[i].date?' · '+esc(String(is[i].date).slice(0,4)):'')+'</div></div></div>';

/* ================= 交互：点击路由 ================= */
function pickActEl(t){
  var el=t;
  while(el && el!==document.body && el.nodeType===1){
    if(el.tagName==='BUTTON') return el;
    if(el.hasAttribute && el.hasAttribute('data-act')) return el;
    el=el.parentNode;
  }
  return null;
}
document.addEventListener('click',function(e){
  var el=pickActEl(e.target);
  if(!el){
    var cell=e.target;
    while(cell && cell!==document.body){
      if(cell.hasAttribute && cell.hasAttribute('data-daycell')){ formEvent(null,cell.getAttribute('data-daycell')); return; }
      cell=cell.parentNode;
    }
    return;
  }
  var a=el.getAttribute('data-act');
  var id=el.getAttribute('data-id');
  var i;

  if(a==='nav'){ go(el.getAttribute('data-nav')); return; }
  if(a==='navRename'){ closeCtx(); startNavRename(el.getAttribute('data-nav')); return; }
  if(a==='navReset'){
    var nk=el.getAttribute('data-nav'); closeCtx();
    setNavLabel(nk,''); refreshAll();
    toast((LANG==='zh'?'已恢复为「':'Restored to "')+navDefault(nk)+(LANG==='zh'?'」':'"'),'ok');
    return;
  }
  if(a==='closeModal'){ closeModal(); return; }
  if(a==='settings'){ formSettings(); return; }

  if(a==='openPath'){ doOpen('folder',el.getAttribute('data-path')); return; }
  if(a==='revealPath'){ api('/api/reveal',{target:el.getAttribute('data-path')}).then(function(r){
      toast(r&&r.ok?(LANG==='zh'?'已在资源管理器中定位':'Revealed'):((r&&r.msg)||'失败'), r&&r.ok?'ok':'err'); }); return; }
  if(a==='openUrl'){ doOpen('url',el.getAttribute('data-url')); return; }
  if(a==='openShortcut'){ openShortcut(id); return; }
  if(a==='browseDir'){ e.stopPropagation(); browseDir(el.getAttribute('data-path')); return; }
  if(a==='closeDrawer'){ var b=$('likeDrawer'); if(b) b.style.display='none'; S.drawerPath=''; return; }

  if(a==='addEvent'){ formEvent(null,el.getAttribute('data-date')||todayStr()); return; }
  if(a==='editEvent'){ if(S.dragMoved){ S.dragMoved=false; return; } formEvent(id); return; }
  if(a==='delEvent'){ custom_remove('events',id,eventTitle(id)); return; }
  if(a==='calMode'){ S.calMode=el.getAttribute('data-v'); refreshAll(); return; }
  if(a==='calPrev'){ S.calMonth--; if(S.calMonth<0){S.calMonth=11;S.calYear--;} refreshAll(); return; }
  if(a==='calNext'){ S.calMonth++; if(S.calMonth>11){S.calMonth=0;S.calYear++;} refreshAll(); return; }
  if(a==='calToday'){ var d=new Date(); S.calYear=d.getFullYear(); S.calMonth=d.getMonth(); refreshAll(); return; }

  if(a==='addClass'){ formSchedule(null,el.getAttribute('data-day'),el.getAttribute('data-start')); return; }
  if(a==='editClass'){ formSchedule(id); return; }
  if(a==='delClass'){
    var cl=byId(S.db.classes||[],id);
    if(cl){ S.db.classes.splice(S.db.classes.indexOf(cl),1); saveKey('classes'); refreshAll();
            toast(LANG==='zh'?'已删除':'Deleted','ok'); }
    return;
  }
  if(a==='clsPrev'){ S.schOff=(S.schOff||0)-1; refreshAll(); return; }
  if(a==='clsNext'){ S.schOff=(S.schOff||0)+1; refreshAll(); return; }
  if(a==='clsToday'){ S.schOff=0; refreshAll(); return; }
  if(a==='clsSet'){ formClassSettings(); return; }
  if(a==='schView'){ S.schView=(el.getAttribute('data-v')==='list')?'list':'week'; refreshAll(); return; }
  if(a==='importSchedule'){ formImportSchedule(); return; }
  if(a==='bulkWeeks'){
    var bwv=($('bulkWeeks')&&$('bulkWeeks').value||'').trim();
    var clsArr=S.db.classes||[], ci;
    for(ci=0;ci<clsArr.length;ci++) clsArr[ci].weeks=bwv;
    saveKey('classes'); refreshAll();
    toast(LANG==='zh'?('已把 '+clsArr.length+' 门课的周次设为 '+(bwv||'空')):'Weeks updated','ok');
    return;
  }
  if(a==='impAll'){ var ka=document.querySelectorAll('.impck'); for(var qa=0;qa<ka.length;qa++) ka[qa].checked=true; return; }
  if(a==='impNone'){ var kn=document.querySelectorAll('.impck'); for(var qn=0;qn<kn.length;qn++) kn[qn].checked=false; return; }
  if(a==='impDo'){ schedImportDo(); return; }

  if(a==='selPaper'){ S.selPaper=id; refreshAll(); return; }
  if(a==='addPaper'){ formPaper(null); return; }
  if(a==='editPaper'){ formPaper(id); return; }
  if(a==='delPaper'){ removeWithUndo('papers',id,(findPaper(id)||{}).title||''); return; }
  if(a==='logProgress'){
    var p=findPaper(id); if(!p) return;
    var txt=prompt(LANG==='zh'?'记录一条进展：':'Log a progress note:');
    if(!txt) return;
    logHistory(p,txt); p.updatedAt=Date.now();
    saveKey('papers'); refreshAll(); toast(LANG==='zh'?'已记录':'Logged','ok'); return;
  }
  if(a==='addFile'){
    var pp=findPaper(id); if(!pp) return;
    api('/api/pick',{kind:'file'}).then(function(r){
      if(!r||!r.ok||!r.path) return;
      pp.files=pp.files||[];
      pp.files.push({name:r.path.split('\\').pop(), path:r.path});
      saveKey('papers'); refreshAll(); toast(LANG==='zh'?'已添加文件':'File added','ok');
    }); return;
  }
  if(a==='delFile'){
    var p2=findPaper(id); if(!p2) return;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var removed=(p2.files||[]).splice(idx,1)[0];
    saveKey('papers'); refreshAll();
    toast(LANG==='zh'?'已移除文件':'Removed',null,function(){ p2.files.splice(idx,0,removed); saveKey('papers'); refreshAll(); });
    return;
  }
  if(a==='jump'){
    var k=el.getAttribute('data-kind');
    if(k==='paper'){ S.selPaper=id; go('papers'); } else go('projects');
    return;
  }

  if(a==='pickZotero'){ formZoteroPicker(id); return; }
  if(a==='zlink'){ linkZotero(el.getAttribute('data-pid'),parseInt(el.getAttribute('data-i'),10)); return; }
  if(a==='unlinkZotero'){
    var p3=findPaper(id); if(!p3) return;
    var ix=parseInt(el.getAttribute('data-idx'),10);
    var rm=(p3.zoteroKeys||[]).splice(ix,1)[0];
    saveKey('papers'); refreshAll();
    toast(LANG==='zh'?'已取消关联':'Unlinked',null,function(){ p3.zoteroKeys.splice(ix,0,rm); saveKey('papers'); refreshAll(); });
    return;
  }
  if(a==='openZoteroItem'){ openZoteroItem(id,parseInt(el.getAttribute('data-idx'),10)); return; }

  if(a==='previewObs'){
    openNoteModal(el.getAttribute('data-rel'),el.getAttribute('data-vault')||'');
    return;
  }
  if(a==='openObsApp'){
    var rl=el.getAttribute('data-rel')||'';
    var vn=el.getAttribute('data-vault')||vaultNameOf(vaultPath());
    doOpen('url','obsidian://open?vault='+encodeURIComponent(vn)
      +'&file='+encodeURIComponent(rl.replace(/\.md$/i,'')));
    return;
  }
  if(a==='linkObs'){
    var lp=findPaper(id); if(!lp) return;
    lp.obsidianRel=el.getAttribute('data-rel')||'';
    lp.obsidianName=el.getAttribute('data-name')||'';
    lp.obsidianVault=el.getAttribute('data-vault')||'';
    lp.obsidianVaultName=el.getAttribute('data-vname')||vaultNameOf(lp.obsidianVault);
    saveKey('papers'); renderObsMatch(id);
    toast(LANG==='zh'?'已关联 Obsidian 笔记':'Note linked','ok'); return;
  }
  if(a==='unlinkObs'){
    var up=findPaper(id); if(!up) return;
    up.obsidianRel=''; up.obsidianName='';
    up.obsidianVault=''; up.obsidianVaultName='';
    saveKey('papers'); renderObsMatch(id); return;
  }
  if(a==='rematchObs'){ S._obsM=null; loadObsMatch(id); return; }
  if(a==='openZoteroRaw'){
    var pth=el.getAttribute('data-path');
    if(pth) doOpen('file',pth);
    else toast(LANG==='zh'?'该条目没有本地附件，可在 Zotero 里打开':'No local attachment','err');
    return;
  }

  if(a==='addProject'){ formProject(null); return; }
  if(a==='editProject'){ formProject(id); return; }
  if(a==='delProject'){ removeWithUndo('projects',id,(findProject(id)||{}).name||''); return; }

  if(a==='addPub'){ formPub(null); return; }
  if(a==='importPub'){ formImportPub(); return; }
  if(a==='refreshCites'){ refreshCitationCounts(); return; }
  if(a==='parseBib'){
    var txt=$('imBib')? $('imBib').value : '';
    if(!txt.trim()){ toast(LANG==='zh'?'先粘贴 BibTeX 内容':'Paste BibTeX first','err'); return; }
    api('/api/bibtex',{text:txt}).then(function(r){
      renderImpPreview((r&&r.items)||[], (r&&!r.ok&&r.msg)? r.msg : '');
    });
    return;
  }
  if(a==='fetchDoi'){
    var dv=$('imDoi')? $('imDoi').value.trim() : '';
    if(!dv){ toast(LANG==='zh'?'先填 DOI':'Enter a DOI first','err'); return; }
    toast(LANG==='zh'?'正在查询 Crossref…':'Querying Crossref…');
    api('/api/doi',{doi:dv}).then(function(r){
      if(!r||!r.ok){ toast((r&&r.msg)||(LANG==='zh'?'查询失败':'Lookup failed'),'err'); return; }
      renderImpPreview([r], LANG==='zh'?('查到了：'+r.title):('Found: '+r.title));
    });
    return;
  }
  if(a==='addImpRow'){
    var rc=addImpRow((S.impRows||[])[parseInt(el.getAttribute('data-i'),10)]);
    if(rc){ saveKey('pubs'); closeModal(); refreshAll(); toast(LANG==='zh'?'已加入已发表':'Added','ok'); }
    return;
  }
  if(a==='addImpAll'){
    var rows=S.impRows||[], k;
    for(k=rows.length-1;k>=0;k--) addImpRow(rows[k]);
    saveKey('pubs'); closeModal(); refreshAll();
    toast((LANG==='zh'?('已加入 '+rows.length+' 条'):('Added '+rows.length+' entries')),'ok');
    return;
  }
  if(a==='copyPub'){ formCopyPub(id); return; }
  if(a==='quickCite'){ formCite(id); return; }
  if(a==='pushCopy'){
    var src=$(el.getAttribute('data-src'));
    if(src) doCopy(String(src.value), LANG==='zh'?'已复制到剪贴板':'Copied');
    return;
  }
  if(a==='editPub'){ formPub(id); return; }
  if(a==='delPub'){ removeWithUndo('pubs',id,(byId(S.db.pubs,id)||{}).title||''); return; }
  if(a==='pubFilter'){ S.pubFilter=el.getAttribute('data-f')||'all'; renderPage(); return; }
  if(a==='toggleRep'){
    var rp=byId(S.db.pubs,id); if(!rp) return;
    var reps=S.db.pubs.filter(function(x){ return !!x.rep; });
    if(!rp.rep && reps.length>=5){
      toast(tt('repFull'),'err'); return;
    }
    rp.rep=!rp.rep;
    saveKey('pubs'); refreshAll();
    toast(rp.rep?tt('repSet'):tt('repUnset'),'ok');
    return;
  }

  /* ---- 已立项 ---- */
  if(a==='addGrant'){ formGrant(null); return; }
  if(a==='editGrant'){ formGrant(id); return; }
  if(a==='delGrant'){ removeWithUndo('grants',id,(byId(S.db.grants,id)||{}).name||''); return; }

  /* ---- 教学成果 ---- */
  if(a==='addTeaching'){ formTeaching(null); return; }
  if(a==='editTeaching'){ formTeaching(id); return; }
  if(a==='delTeaching'){ removeWithUndo('teaching',id,(byId(S.db.teaching,id)||{}).content||''); return; }
  if(a==='addTeachProject'){ formTeachProject(null); return; }
  if(a==='editTeachProject'){ formTeachProject(id); return; }
  if(a==='delTeachProject'){ removeWithUndo('teachProjects',id,(byId(S.db.teachProjects,id)||{}).name||''); return; }

  /* ---- 专利 ---- */
  if(a==='addPatent'){ formPatent(null); return; }
  if(a==='editPatent'){ formPatent(id); return; }
  if(a==='delPatent'){ removeWithUndo('patents',id,(byId(S.db.patents,id)||{}).name||''); return; }

  /* ---- 我的材料 ---- */
  if(a==='addMaterial'){ formMaterial(null); return; }
  if(a==='editMaterial'){ formMaterial(id); return; }
  if(a==='delMaterial'){ removeWithUndo('materials',id,(byId(S.db.materials,id)||{}).name||''); return; }
  if(a==='addMatFromZot'){ pickZoteroMaterial(); return; }
  if(a==='matAddZot'){
    var mn=el.getAttribute('data-name')||'', mp=el.getAttribute('data-path')||'';
    if(!mp) return;
    var dup=false;
    for(var mi=0;mi<S.db.materials.length;mi++) if(S.db.materials[mi].path===mp) dup=true;
    if(dup){ toast(LANG==='zh'?'已经在列表里了':'Already added','info'); return; }
    S.db.materials.push({id:uid('m'),name:mn,path:mp,kind:'file',note:''});
    saveKey('materials'); closeModal(); refreshAll();
    toast(LANG==='zh'?'已添加到我的材料':'Added','ok'); return;
  }
  if(a==='openMaterial'){
    var mo=byId(S.db.materials,id);
    if(mo&&mo.path) doOpen('file',mo.path);
    else toast(LANG==='zh'?'没有可打开的路径':'No path','err');
    return;
  }

  /* ---- 工作计划 ---- */
  if(a==='addPlan'){ formPlan(null); return; }
  if(a==='editPlan'){ formPlan(id); return; }
  if(a==='delPlan'){ removeWithUndo('plans',id,(byId(S.db.plans,id)||{}).title||''); return; }
  if(a==='togglePlan'){
    var pl=byId(S.db.plans,id); if(!pl) return;
    pl.done=!pl.done; saveKey('plans'); refreshAll(); return;
  }

  if(a==='addIdea'){ formIdea(null); return; }
  if(a==='editIdea'){ formIdea(id); return; }
  if(a==='delIdea'){ removeWithUndo('ideas',id,(byId(S.db.ideas,id)||{}).title||''); return; }
  if(a==='ideaToPaper'){ ideaToPaper(id); return; }
  if(a==='pushObsidian'){ pushIdeaToObsidian(id); return; }
  if(a==='importObsidian'){ formObsidianImport(); return; }
  if(a==='browseObsidian'){ formObsidianBrowse(); return; }
  if(a==='oread'){ readNote(el.getAttribute('data-rel')); return; }
  if(a==='oreveal'||a==='oreveal2'){
    var rel=el.getAttribute('data-rel')||el.getAttribute('data-path');
    api('/api/reveal',{target:rel}).then(function(r){ toast(r&&r.ok?'已定位':((r&&r.msg)||'失败'), r&&r.ok?'ok':'err'); });
    return;
  }
  if(a==='oOpen'){
    openNoteModal(el.getAttribute('data-rel'),el.getAttribute('data-vault')||'');
    return;
  }
  if(a==='zopen'){
    var zp=el.getAttribute('data-path'), zu=el.getAttribute('data-url');
    if(zp) doOpen('file',zp); else if(zu) doOpen('url',zu);
    else toast(LANG==='zh'?'无附件':'No attachment','err');
    return;
  }

  if(a==='addDiary'){ formDiary(null); return; }
  if(a==='editDiary'){ formDiary(id); return; }
  if(a==='delDiary'){ removeWithUndo('diary',id,(byId(S.db.diary,id)||{}).date||''); return; }
  if(a==='diaryPin'){ formSettings(); return; }
  if(a==='pinGo'){
    var inp=$('pinInput');
    if(inp&&inp.value===((S.db.settings||{}).pin||'')){ S.diaryUnlocked=true; refreshAll(); }
    else toast(LANG==='zh'?'PIN 不正确':'Wrong PIN','err');
    return;
  }

  if(a==='addShortcut'){ formShortcut(null, el.getAttribute('data-cat')||'本地文件'); return; }
  if(a==='editShortcut'){ formShortcut(id); return; }
  if(a==='delShortcut'){
    var arr=S.db.shortcuts, k2=-1;
    for(i=0;i<arr.length;i++) if(arr[i].id===id){ k2=i; break; }
    if(k2<0) return;
    if(!confirm(LANG==='zh'?'从工作台移除这个入口？（不会删除本地文件）':'Remove this shortcut? (files are untouched)')) return;
    var rmv=arr.splice(k2,1)[0];
    saveKey('shortcuts'); refreshAll();
    toast(LANG==='zh'?'已移除入口':'Removed',null,function(){ arr.splice(k2,0,rmv); saveKey('shortcuts'); refreshAll(); });
    return;
  }
  if(a==='rescan'){
    toast(LANG==='zh'?'正在探测已安装软件…':'Scanning…');
    api('/api/rescan',{}).then(function(r){
      if(!r||!r.ok){ throw new Error((r&&r.msg)||'scan failed'); }
      var n=(r&&r.added)?r.added.length:0;
      var found=Number(r&&r.foundApps!=null?r.foundApps:(r&&r.total))||0;
      return api('/api/state').then(function(s2){
        if(s2&&s2.db) S.db=s2.db;
        refreshAll();
        if(n){
          toast((LANG==='zh'?'扫描完成，新增 ':'Scan complete: added ')+n+(LANG==='zh'?' 个入口':' item(s)'),'ok');
        }else if(found){
          toast(LANG==='zh'?('已识别 '+found+' 个软件，均已在列表中'):('Found '+found+' app(s); all are already listed'),'ok');
        }else{
          toast(LANG==='zh'?'未识别到支持的软件，可用“新增入口”手动添加':'No supported app found; add one manually','err');
        }
      });
    }).catch(function(){ toast(LANG==='zh'?'扫描失败，请稍后重试':'Scan failed; please retry','err'); });
    return;
  }

  if(a==='qr'){
    var kk=el.getAttribute('data-k'), dt=el.getAttribute('data-date');
    closeModal();
    if(kk==='event') formEvent(null,dt||todayStr());
    else if(kk==='paper') formPaper(null);
    else if(kk==='project') formProject(null);
    else if(kk==='idea') formIdea(null);
    else if(kk==='diary') formDiary(null);
    else formShortcut(null);
    return;
  }
  if(a==='pit'){
    var res=S._pRes||[], ix2=parseInt(el.getAttribute('data-i'),10);
    if(res[ix2]&&res[ix2].fn){ var f=res[ix2].fn; closeModal(); f(); }
    return;
  }
},false);
function eventTitle(id){ var e=byId(S.db.events,id); return e? e.title : ''; }
function custom_remove(key,id,label){
  var box=$('modalHost');
  if(box&&box.innerHTML) closeModal();
  removeWithUndo(key,id,label);
}

/* ================= 交互：键盘 & 拖拽 & 定时器 ================= */
document.addEventListener('keydown',function(e){
  var meta=e.ctrlKey||e.metaKey;
  if(meta&&(e.key==='k'||e.key==='K')){ e.preventDefault(); palette(''); return; }
  if(meta&&(e.key==='n'||e.key==='N')){ e.preventDefault(); quickRecord(); return; }
  if(e.key==='Escape'){ closeCtx(); closeModal(); return; }
  if(e.key==='Enter'&&$('pinInput')&&document.activeElement===$('pinInput')){
    var pb=document.querySelector('[data-act="pinGo"]'); if(pb) pb.click();
  }
});

// 总表里直接改「行课周次」：改完就存，不整页刷新，免得输入框失焦
document.addEventListener('change',function(e){
  var t=e.target;
  if(!t||!t.classList||!t.classList.contains('wk-in')) return;
  var cid=t.getAttribute('data-wk');
  var cc=byId(S.db.classes||[],cid);
  if(!cc) return;
  cc.weeks=(t.value||'').trim();
  saveKey('classes');
  toast(LANG==='zh'?'周次已保存':'Weeks saved','ok');
});

document.addEventListener('dragstart',function(e){
  var el=e.target;
  if(el&&el.classList){
    if(el.classList.contains('ev')){
      S.dragId=el.getAttribute('data-id'); S.dragMoved=false;
      try{ e.dataTransfer.setData('text/plain',S.dragId); }catch(err){}
    } else if(el.classList.contains('sc')){
      S.dragShortcut=el.getAttribute('data-id');
      try{ e.dataTransfer.setData('text/plain',S.dragShortcut); e.dataTransfer.effectAllowed='move'; }catch(err){}
    }
  }
});
document.addEventListener('dragover',function(e){
  var el=e.target;
  while(el&&el!==document.body){
    if(el.hasAttribute&&el.hasAttribute('data-daycell')){ e.preventDefault(); el.classList.add('drop'); return; }
    if(el.classList&&el.classList.contains('sc')){ e.preventDefault();
      var cur=document.querySelectorAll('.sc-drop');
      for(var k=0;k<cur.length;k++){ if(cur[k]!==el) cur[k].classList.remove('sc-drop'); }
      el.classList.add('sc-drop'); return; }
    el=el.parentNode;
  }
});
document.addEventListener('dragleave',function(e){
  var el=e.target;
  if(el&&el.classList){
    if(el.classList.contains('drop')) el.classList.remove('drop');
    if(el.classList.contains('sc-drop')) el.classList.remove('sc-drop');
  }
});
document.addEventListener('drop',function(e){
  var el=e.target, cell=null, scEl=null;
  while(el&&el!==document.body){
    if(el.hasAttribute&&el.hasAttribute('data-daycell')){ cell=el; }
    if(!scEl && el.classList && el.classList.contains('sc')){ scEl=el; }
    el=el.parentNode;
  }
  var drops=document.querySelectorAll('.drop');
  for(var i=0;i<drops.length;i++) drops[i].classList.remove('drop');
  var scs=document.querySelectorAll('.sc-drop');
  for(i=0;i<scs.length;i++) scs[i].classList.remove('sc-drop');

  if(S.dragShortcut && scEl){
    e.preventDefault();
    var dg=S.dragShortcut;
    if(scEl.getAttribute('data-id')!==dg){
      reorderShortcut(dg, scEl.getAttribute('data-id'));
    }
    S.dragShortcut=null;
    return;
  }
  if(!cell||!S.dragId) return;
  e.preventDefault();
  var ds=cell.getAttribute('data-daycell'), ev=byId(S.db.events,S.dragId);
  if(ev&&ev.date!==ds){ ev.date=ds; saveKey('events'); S.dragMoved=true; refreshAll();
    toast(LANG==='zh'?'已改期到 '+ds:'Moved to '+ds,'ok'); }
  S.dragId='';
});

/* 同一分组内拖动排序 */
function reorderShortcut(dragId, targetId){
  var arr=S.db.shortcuts, di=-1, ti=-1, i;
  for(i=0;i<arr.length;i++){
    if(arr[i].id===dragId) di=i;
    if(arr[i].id===targetId) ti=i;
  }
  if(di<0||ti<0||di===ti) return;
  if((arr[di].category||'')!==(arr[ti].category||'')){
    toast(tt('dragSame'),'err'); return;
  }
  var mov=arr.splice(di,1)[0];
  for(i=0;i<arr.length;i++) if(arr[i].id===targetId) ti=i;
  arr.splice(ti,0,mov);
  saveKey('shortcuts'); refreshAll();
  toast(LANG==='zh'?'已调整顺序':'Reordered','ok');
}

function focusTick(){
  if(focusLeft<=0){
    clearInterval(focusTimer); focusTimer=null; focusLeft=FOCUS_MIN*60;
    S.db.focus=S.db.focus||{done:0,minutes:0,date:todayStr()};
    if(S.db.focus.date!==todayStr()){ S.db.focus.date=todayStr(); S.db.focus.done=0; S.db.focus.minutes=0; }
    S.db.focus.done=(S.db.focus.done||0)+1;
    S.db.focus.minutes=(S.db.focus.minutes||0)+FOCUS_MIN;
    saveKey('focus'); refreshAll();
    toast(LANG==='zh'?'专注完成，去接杯水吧':'Focus done','ok');
    return;
  }
  focusLeft--; renderFocus();
}

/* ================= 启动 ================= */
function addSettingsLink(){
  var f=document.querySelector('.side-foot');
  if(!f||$('setLink')) return;
  var d=document.createElement('div');
  d.id='setLink'; d.className='st'; d.setAttribute('data-act','settings');
  d.style.cursor='pointer';
  d.innerHTML=ic('user',13)+'<span>'+(LANG==='zh'?'设置与数据':'Settings')+'</span>';
  f.appendChild(d);
}
function loadZotero(n){
  n=n||0;
  api('/api/zotero/status').then(function(r){
    r=r||{ok:false};
    S.zot=r; renderTop();
    // 后端正在复制快照（首次 / Zotero 运行中），稍后自动重试
    if(r.pending && n<20){ setTimeout(function(){ loadZotero(n+1); },1200); return; }
    if(r.ok) api('/api/zotero/profile').then(function(p2){
      S.zotProfile=(p2&&p2.items)||[];
      if(S.page==='common') renderPage();
    });
  }).catch(function(){ if(n<4) setTimeout(function(){ loadZotero(n+1); },1500); });
}
function loadObsidian(){
  api('/api/obsidian/vaults').then(function(r){
    S.obs={vaults:(r&&r.vaults)||[],cur:''};
    renderTop();
  });
}
function boot(){
  api('/api/state').then(function(r){
    if(!r||!r.ok){ toast(LANG==='zh'?'连接本地服务失败':'Cannot reach local service','err'); return; }
    S.db=r.db; S.dataDir=r.dataDir; S.version=r.version;
    LANG=(S.db.settings&&S.db.settings.lang)||'zh';
    FOCUS_MIN=(S.db.settings&&S.db.settings.focusMin)||25;
    focusLeft=FOCUS_MIN*60;
    var d=new Date();
    S.calYear=d.getFullYear(); S.calMonth=d.getMonth();
    if(S.db.papers&&S.db.papers.length) S.selPaper=S.db.papers[0].id;
    refreshAll(); addSettingsLink(); loadZotero(); loadObsidian();
  }).catch(function(){ toast(LANG==='zh'?'连接本地服务失败':'Cannot reach local service','err'); });
}

$('focusBtn').onclick=function(){
  if(focusTimer){ clearInterval(focusTimer); focusTimer=null; }
  else focusTimer=setInterval(focusTick,1000);
  renderFocus();
};
$('langBtn').onclick=function(){
  LANG=(LANG==='zh'?'en':'zh');
  S.db.settings.lang=LANG; saveKey('settings'); refreshAll();
};
$('quickBtn').onclick=function(){ quickRecord(); };
$('searchBtn').onclick=function(){ palette(''); };

// 注意：不要在这里发 /api/quit。窗口关闭由后端监控 Edge 进程来决定是否退出；
// 整页刷新（F5、数据导入后的 location.reload）也会触发 beforeunload，若在此
// 直接 quit 会误杀后端，导致界面还在却点不开任何链接。
setInterval(function(){ fetch('/api/ping').catch(function(){}); },10000);

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
})();

</script>
